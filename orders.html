<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ice Earring | My Transactions</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <section id="header">
        <a href="index.html"><img src="img/logo.png" class="logo" alt="Ice Earring logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="blog.html">Blog</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="contact.html">Contact</a></li>
                <li><a id="auth-link" href="login.html">Login</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa fa-shopping-cart"></i></a></li>
                <li><a href="orders.html" class="active">My Orders</a></li>
                <a href="#" id="close"><i class="fa fa-close"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fa fa-shopping-cart"></i></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <section class="section-p1">
        <div class="hero-content" style="background: none; box-shadow: none; padding: 0;">
            <h2>My Transactions</h2>
            <p>View your order history and payment status.</p>
        </div>
    </section>

    <section class="section-p1">
        <div class="orders-controls">
            <div class="filter-section">
                <label>Filter by Status:</label>
                <select id="statusFilter">
                    <option value="all">All Orders</option>
                    <option value="pending">Pending</option>
                    <option value="verifying">Verifying</option>
                    <option value="verified">Verified</option>
                    <option value="paid">Paid</option>
                    <option value="rejected">Rejected</option>
                </select>
            </div>
            <div class="refresh-section">
                <button class="btn btn-secondary" onclick="loadOrders()">
                    <i class="fa fa-refresh"></i> Refresh
                </button>
            </div>
        </div>
        <div id="orders-container">
            <div class="loading">Loading your orders...</div>
        </div>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img src="img/logo.png" alt="Ice Earring logo">
            <p>Secure checkout and easy returns on every order.</p>
        </div>
        <div class="col">
            <h4>About</h4>
            <a href="about.html">About Us</a>
            <a href="contact.html">Contact</a>
        </div>
        <div class="col">
            <h4>Support</h4>
            <p>help@iceearring.com</p>
        </div>
        <div class="copyright">
            <p>© <span id="year"></span> Ice Earring. All rights reserved.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
    <script src="orders.js"></script>
</body>
</html>
