<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Orders | Ice Earring</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <section id="header">
        <a href="index.html"><img src="img/logo.png" class="logo" alt="Ice Earring logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="admin-orders.html" class="active">Admin Orders</a></li>
                <li><a href="orders.html">My Orders</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa fa-shopping-cart"></i></a></li>
                <a href="#" id="close"><i class="fa fa-close"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fa fa-shopping-cart"></i></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <section class="section-p1">
        <div class="hero-content" style="background: none; box-shadow: none; padding: 0;">
            <h2>Admin Orders Dashboard</h2>
            <p>View and manage all customer orders</p>
        </div>
    </section>

    <section class="section-p1">
        <div class="admin-orders-container">
            <div class="admin-controls">
                <div class="filter-section">
                    <label>Filter by Status:</label>
                    <select id="statusFilter">
                        <option value="all">All Orders</option>
                        <option value="pending">Pending</option>
                        <option value="verifying">Verifying</option>
                        <option value="verified">Verified</option>
                        <option value="rejected">Rejected</option>
                    </select>
                </div>
                <div class="search-section">
                    <input type="text" id="searchInput" placeholder="Search by customer name or email...">
                </div>
            </div>
            <div id="orders-table" class="orders-table"></div>
        </div>
    </section>

    <footer class="section-p1">
        <div class="col">
            <img src="img/logo.png" alt="Ice Earring logo">
            <p>Admin dashboard for managing customer orders</p>
        </div>
        <div class="col">
            <h4>Quick links</h4>
            <a href="index.html">Home</a>
            <a href="shop.html">Shop</a>
            <a href="cart.html">Cart</a>
        </div>
        <div class="copyright">
            <p>© <span id="year"></span> Ice Earring. All rights reserved.</p>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="admin-orders.js"></script>
</body>
</html>
